services:
  postgres:
    image: postgres:16
    container_name: tosumo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tosumo
      POSTGRES_PASSWORD: tosumo_secret
      POSTGRES_DB: tosumo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tosumo -d tosumo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tosumo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tosumo:tosumo_secret@postgres:5432/tosumo?schema=public
      DIRECT_URL: postgresql://tosumo:tosumo_secret@postgres:5432/tosumo?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
