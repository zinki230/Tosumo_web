name: tosumo_doctor
description: "TOSUMO Doctor Application - Digital Health Identity Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  file_picker: ^10.1.7
  url_launcher: ^6.3.1
  google_fonts: ^8.2.0
  intl: ^0.20.2
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.15
  path_provider: ^2.1.1
  uuid: ^4.2.1
  pdf: ^3.13.0
  printing: ^5.15.0
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/TOSUMO.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/TOSUMO.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
