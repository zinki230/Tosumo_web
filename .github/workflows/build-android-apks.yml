name: Build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/doctor_flutter/**'
      - 'apps/patient_flutter/**'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build doctor and patient APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('apps/doctor_flutter/pubspec.lock', 'apps/patient_flutter/pubspec.lock') }}

      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter dependencies
        run: |
          cd apps/doctor_flutter && flutter pub get
          cd ../patient_flutter && flutter pub get

      - name: Build doctor release APK (retry transient Gradle download errors)
        working-directory: apps/doctor_flutter
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --dart-define=API_BASE_URL=https://tosumobackend-production.up.railway.app && exit 0
            echo "Doctor APK build attempt ${attempt} failed; retrying after a short delay."
            sleep 15
          done
          exit 1

      - name: Build patient release APK (retry transient Gradle download errors)
        working-directory: apps/patient_flutter
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --dart-define=API_BASE_URL=https://tosumobackend-production.up.railway.app && exit 0
            echo "Patient APK build attempt ${attempt} failed; retrying after a short delay."
            sleep 15
          done
          exit 1

      - name: Upload doctor APK
        uses: actions/upload-artifact@v4
        with:
          name: tosumo-doctor-android-apk
          path: apps/doctor_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload patient APK
        uses: actions/upload-artifact@v4
        with:
          name: tosumo-patient-android-apk
          path: apps/patient_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
